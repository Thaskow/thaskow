<svg xmlns="http://www.w3.org/2000/svg" width="900" height="384" viewBox="0 0 900 384" role="img" aria-label="CStonx: Leetify and FACEIT stats for all 10 players in your CS2 match, right in the Steam overlay">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #e8e6f5; }
  .muted { fill: #8a86a8; }
  .accent { fill: #7b6cff; }
  .accent2 { fill: #c58bff; }
  .prompt { fill: #3fb950; }
  .sys { font-size: 13px; letter-spacing: 1.5px; fill: #7b6cff; }
  .cmd { font-size: 15px; fill: #8a86a8; }
  .line { font-size: 15px; }
  .h { font-size: 22px; font-weight: 700; }
  .num { font-size: 13px; fill: #8a86a8; }
  .small { font-size: 11.5px; fill: #8a86a8; }
  .label { font-size: 10.5px; letter-spacing: 1.5px; fill: #8a86a8; }
  .value { font-size: 32px; font-weight: 800; fill: #c58bff; font-variant-numeric: tabular-nums; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .glitch-a { animation: glitch 7s infinite; }
  .glitch-b { animation: glitch 7s infinite reverse; }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes glitch {
    0%, 91%, 100% { transform: none; }
    92% { transform: translate(-5px, 1px); }
    94% { transform: translate(4px, -1px); }
    96% { transform: translate(-2px, 0); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
