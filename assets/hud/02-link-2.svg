<svg xmlns="http://www.w3.org/2000/svg" width="201" height="96" viewBox="0 0 201 96" role="img" aria-label="X: @thaskow">
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #e8e6f5; }
  .muted { fill: #8a86a8; }
  .accent { fill: #7b6cff; }
  .accent2 { fill: #c58bff; }
  .prompt { fill: #3fb950; }
  .sys { font-size: 13px; letter-spacing: 1.5px; fill: #7b6cff; }
  .cmd { font-size: 15px; fill: #8a86a8; }
  .line { font-size: 15px; }
  .h { font-size: 22px; font-weight: 700; }
  .num { font-size: 13px; fill: #8a86a8; }
  .small { font-size: 11.5px; fill: #8a86a8; }
  .label { font-size: 10.5px; letter-spacing: 1.5px; fill: #8a86a8; }
  .value { font-size: 32px; font-weight: 800; fill: #c58bff; font-variant-numeric: tabular-nums; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .blink { animation: blink 1.1s steps(1) infinite; }
  .glitch-a { animation: glitch 7s infinite; }
  .glitch-b { animation: glitch 7s infinite reverse; }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes glitch {
    0%, 91%, 100% { transform: none; }
    92% { transform: translate(-5px, 1px); }
    94% { transform: translate(4px, -1px); }
    96% { transform: translate(-2px, 0); }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><pattern id="grid" x="2" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#19162e"/></pattern></defs>
<rect width="201" height="96" fill="#0a0912"/>
<rect x="0" y="0" width="201" height="96" fill="#0f0d1c"/>
<rect x="0" y="0" width="201" height="96" fill="url(#grid)"/>

<path d="M8 10H183L193 20V70H8Z" fill="#0a0912" fill-opacity=".55" stroke="#7b6cff" stroke-opacity=".45"/><path d="M8 24V10H22" fill="none" stroke="#7b6cff" stroke-width="2"/><text x="24" y="37" font-size="15" font-weight="700" style="fill:#c58bff">X <tspan class="muted" font-weight="400">↗</tspan></text><text class="small" x="24" y="58">@thaskow</text>
</svg>
