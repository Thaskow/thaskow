<svg xmlns="http://www.w3.org/2000/svg" width="900" height="315" viewBox="0 0 900 315" role="img" aria-label="Thaskow aka Lucas, fullstack developer from Dole, France">
<defs><clipPath id="bdclip"><path d="M0 20Q0 0 20 0H880Q900 0 900 20V315V315H0Z"/></clipPath></defs>
<path d="M0 20Q0 0 20 0H880Q900 0 900 20V315V315H0Z" fill="#fcfbff"/>
<g clip-path="url(#bdclip)"><svg x="20" y="28" width="860" height="277.11" viewBox="0 0 900 290">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .hey { font-size: 13px; font-weight: 600; letter-spacing: 3px; fill: #6a5af9; }
  .name { font-size: 64px; font-weight: 800; letter-spacing: -2px; }
  .aka { font-size: 20px; font-weight: 500; fill: #59636e; }
  .chev { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; fill: #b57bff; }
  .role { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; fill: #1f2328; opacity: 0; animation: role 9s infinite; }
  .r0 { opacity: 1; }
  .r1 { animation-delay: 3s; }
  .r2 { animation-delay: 6s; }
  @keyframes role {
    0%, 28% { opacity: 1; transform: none; }
    33%, 95% { opacity: 0; transform: translateY(-8px); }
    100% { opacity: 1; transform: none; }
  }
  .orb { animation: drift 14s ease-in-out infinite alternate; }
  .orb2 { animation-duration: 18s; animation-direction: alternate-reverse; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(60px, 25px); } }
  .prompt { font-size: 13px; fill: #b57bff; }
  .cmd { fill: #1f2328; }
  .out { font-size: 13px; fill: #59636e; }
  .title { font-size: 12px; fill: #59636e; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3efff"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6a5af9"/><stop offset="1" stop-color="#b57bff"/>
  </linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#6a5af9" stop-opacity="0.40"/><stop offset="1" stop-color="#6a5af9" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#b57bff" stop-opacity="0.40"/><stop offset="1" stop-color="#b57bff" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e5e7eb"/></pattern>
  <clipPath id="frame"><rect width="900" height="290" rx="16"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="900" height="290" fill="url(#bg)"/>
  <rect width="900" height="290" fill="url(#dots)"/>
  <circle class="orb" cx="180" cy="40" r="220" fill="url(#g1)"/>
  <circle class="orb orb2" cx="720" cy="260" r="250" fill="url(#g2)"/>
</g>
<rect x=".5" y=".5" width="899" height="289" rx="16" fill="none" stroke="#d1d9e0"/>

<text class="hey" x="66" y="85">HEY, I'M</text>
<text class="name" x="62" y="149" fill="url(#ink)">Thaskow</text>
<text class="aka" x="342" y="149">aka Lucas</text>
<text class="chev" x="64" y="205" dx="-22">›</text>
<text class="role r0" x="64" y="205">Fullstack developer</text>
<text class="role r1" x="64" y="205">Building CStonx for CS2 players</text>
<text class="role r2" x="64" y="205">Self-hosting all the things</text>

<rect x="540" y="40" width="320" height="214" rx="10" fill="#f6f8fa" fill-opacity=".85" stroke="#d1d9e0"/>
<circle cx="560" cy="58" r="5" fill="#ff5f57"/><circle cx="578" cy="58" r="5" fill="#febc2e"/><circle cx="596" cy="58" r="5" fill="#28c840"/>
<text class="title mono" x="700" y="62" text-anchor="middle">~/thaskow</text>
<line x1="540" y1="74" x2="860" y2="74" stroke="#d1d9e0"/>
<g><text class="mono prompt" x="560" y="100">$ <tspan class="cmd">whoami</tspan></text><text class="mono out" x="560" y="120">thaskow (Lucas)</text></g><g><text class="mono prompt" x="560" y="140">$ <tspan class="cmd">location</tspan></text><text class="mono out" x="560" y="160">Dole, France</text></g><g><text class="mono prompt" x="560" y="180">$ <tspan class="cmd">now</tspan></text><text class="mono out" x="560" y="200">shipping CStonx v1</text></g><g><text class="mono prompt" x="560" y="220">$ <tspan class="cmd">stack</tspan></text><text class="mono out" x="560" y="240">C++ · Vue · Python · Docker</text></g>
</svg>
